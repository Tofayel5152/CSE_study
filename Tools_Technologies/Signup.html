<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup - IIUC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <table>
      <tr>
        <td><img src="Picture\IIUC.png" alt="IIUC Logo" width="50" height="50"></td>
        <td><div class="box-title">IIUC</div></td>
      </tr>
    </table>
  </header>

  <main>
    <div class="box">
      <h1>Signup</h1>
      <section>
        <form action="login.html" method="get">
          <label for="id">ID: </label>
          <input type="text" id="id" name="id" required>
            <br>
          <label for="password">Password: </label>
          <input type="password" id="password" name="password" required minlength="6">
            <br>
          <label for="confirm">Confirm Password: </label>
          <input type="password" id="confirm" name="confirm" required minlength="6">
            <br>

          <button type="submit">Sign Up</button>
        </form>
      </section>
    </div>
  </main>
<br>

  <footer>
    <a class="back-link" href="index.html">&larr; Back</a>
  </footer>

</body>
</html>
